name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run SARIF helper tests
        run: |
          set -euo pipefail
          python3 .github/scripts/sigilix_sarif_test.py
          python3 .github/scripts/eslint_ts_workflow_test.py
          python3 .github/scripts/tsc_workflow_test.py
          python3 .github/scripts/pylint_workflow_test.py
          python3 .github/scripts/trufflehog_converter_test.py
          python3 .github/scripts/language_config_tools_workflow_test.py
          python3 .github/scripts/knip_workflow_test.py
          python3 .github/scripts/biome_workflow_test.py
          python3 .github/scripts/docs_config_tools_test.py
          python3 .github/scripts/oxlint_workflow_test.py
          python3 .github/scripts/ast_grep_workflow_test.py
          python3 .github/scripts/policy_iac_tools_workflow_test.py
          python3 -m py_compile .github/scripts/*.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint workflows (actionlint + YAML validity)
        run: |
          set -euo pipefail
          # Validate every workflow file parses as YAML, then run actionlint
          # (pinned release) for GitHub Actions-specific checks. Self-contained;
          # no third-party action with an unpinned ref.
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "pyyaml"])
              import yaml
          files = glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print("yaml ok:", f)
          if not files:
              print("no workflow files")
          PY
          ACTIONLINT_VERSION=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color
