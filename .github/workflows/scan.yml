name: Sigilix Runner — deterministic scan

# Reusable workflow. A caller invokes it (pin to a commit SHA):
#
#   jobs:
#     scan:
#       uses: sigilix/runner/.github/workflows/scan.yml@<commit-sha>
#       permissions:
#         contents: read
#         id-token: write
#       with:
#         ingest-url: https://<sigilix-worker>/runner/ingest
#         oidc-audience: <Sigilix's configured ingest audience>
#
# It runs deterministic tools on the caller's checked-out code, normalizes the
# output to SARIF, mints a GitHub Actions OIDC token, and POSTs the SARIF + token
# to Sigilix. The source never leaves CI except as normalized SARIF findings.

on:
  workflow_call:
    inputs:
      ingest-url:
        description: "Sigilix ingest endpoint (the worker's POST /runner/ingest)."
        required: true
        type: string
      oidc-audience:
        description: "OIDC token audience; must equal Sigilix's configured ingest audience."
        required: true
        type: string
      semgrep-config:
        description: "Semgrep ruleset passed to `semgrep --config` (default: auto)."
        required: false
        default: "auto"
        type: string
      gitleaks:
        description: "Also run gitleaks (secret-leak proof) and merge its SARIF (default: true)."
        required: false
        default: true
        type: boolean
      osv-scanner:
        description: "Also run osv-scanner (dependency-vuln proof) and merge its SARIF (default: true)."
        required: false
        default: true
        type: boolean

permissions:
  contents: read # read the checked-out source
  id-token: write # mint the OIDC receipt — the ONLY elevated permission

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge ref for PRs)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Use the DEFAULT checkout — no `ref:` override. On a pull_request event
          # that is `refs/pull/N/merge` (the test-merge commit), whose tip equals
          # `github.sha`; on push it is `github.sha` directly. That alignment is
          # load-bearing: the OIDC token's `sha` claim is `github.sha`, so the
          # scanned tree == the signed commit, and Sigilix can bind the receipt by
          # requiring `claims.sha` == the PR's `merge_commit_sha` (CR-4). Scanning
          # the PR head instead would make the SARIF's revisionId disagree with the
          # bound merge sha and demote the evidence.
          persist-credentials: false

      - name: Run Semgrep → SARIF
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet semgrep
          # A non-zero exit on findings must NOT fail the caller's CI — the receipt
          # is best-effort evidence, not a merge gate.
          semgrep scan --config "$SEMGREP_CONFIG" --sarif --output sarif.json --quiet || true
          # Guarantee a well-formed SARIF doc even if semgrep produced none.
          if [ ! -s sarif.json ]; then printf '{"version":"2.1.0","runs":[]}' > sarif.json; fi

      - name: Run gitleaks → merge SARIF (secret-leak proof)
        if: ${{ inputs.gitleaks }}
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          # Pinned release binary (no third-party action / unpinned ref). UNLIKE
          # ci.yml (Sigilix's OWN CI, where a hard fail is fine), this runs in the
          # CALLER's CI under a best-effort contract — a download failure (404 /
          # rate-limit / network) must NOT fail their job, so degrade to "gitleaks
          # unavailable, keep the semgrep SARIF" via exit 0 (sarif.json already
          # holds the well-formed semgrep doc from the prior step).
          if ! curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks; then
            echo "::warning::gitleaks download failed — skipping (semgrep SARIF unchanged)."
            exit 0
          fi
          # `dir` scans the checked-out merge-tree FILES (not git history), so a
          # finding aligns with the scanned revision (the OIDC `sha`), same as
          # semgrep. `--exit-code 0` + `|| true`: a leak must NOT fail the caller's
          # CI — the receipt is best-effort evidence, not a merge gate.
          ./gitleaks dir . --report-format sarif --report-path gitleaks.sarif --exit-code 0 --no-banner || true
          if [ ! -s gitleaks.sarif ]; then printf '{"version":"2.1.0","runs":[]}' > gitleaks.sarif; fi
          # Merge gitleaks' runs into the semgrep SARIF — one envelope = one SARIF
          # doc, and SARIF allows multiple `runs` (one per tool). Size-guard the
          # worker's 8 MiB ingest cap (SIG-184 413): if combined exceeds it, keep
          # semgrep only (the established lane wins) and notice the drop.
          # `|| true`: the merge must NOT fail the caller's CI — on any python error
          # (ENOSPC on the write, missing interpreter, pathological input) sarif.json
          # is left as the semgrep-only doc from the prior step (the degraded state).
          python3 - <<'PY' || true
          import json
          CAP = 7_800_000  # bytes — under the worker's REPORT_SIZE_CAP_BYTES (8 MiB)
          def load(p):
              try:
                  with open(p) as f:
                      d = json.load(f)
                  return d if isinstance(d, dict) else {"version": "2.1.0", "runs": []}
              except Exception:
                  return {"version": "2.1.0", "runs": []}
          base = load("sarif.json")
          extra = load("gitleaks.sarif")
          base_runs = base.get("runs") or []
          extra_runs = extra.get("runs") or []
          merged = dict(base)
          merged["runs"] = base_runs + extra_runs
          out = json.dumps(merged)
          if len(out.encode("utf-8")) > CAP:
              print("::warning::combined SARIF over ingest cap — keeping semgrep only")
              base["runs"] = base_runs
              out = json.dumps(base)
          with open("sarif.json", "w") as f:
              f.write(out)
          PY

      - name: Run osv-scanner → merge SARIF (dependency-vuln proof)
        if: ${{ inputs.osv-scanner }}
        env:
          OSV_SCANNER_VERSION: "2.3.8"
        run: |
          set -euo pipefail
          # Pinned raw release binary (no third-party action / unpinned ref). Same
          # best-effort contract as gitleaks: this runs in the CALLER's CI, so a
          # download failure must NOT fail their job — degrade to the existing
          # (semgrep[+gitleaks]) SARIF via exit 0 (sarif.json already holds it).
          if ! curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"; then
            echo "::warning::osv-scanner download failed — skipping (SARIF unchanged)."
            exit 0
          fi
          chmod +x osv-scanner
          # `scan source -r .` finds + scans dependency lockfiles in the checked-out
          # merge tree (aligns findings with the OIDC `sha`). osv-scanner exits 1 when
          # vulns are found and non-zero when there are no lockfiles to scan — NEITHER
          # may fail the caller's CI, so `|| true`. `--output-file` writes the SARIF
          # straight to a file (not stdout), so a progress/banner line can't corrupt
          # it — matching the gitleaks `--report-path` pattern (diagnostics → stderr).
          ./osv-scanner scan source -r --format sarif --output-file osv.sarif . || true
          if [ ! -s osv.sarif ]; then printf '{"version":"2.1.0","runs":[]}' > osv.sarif; fi
          # Merge osv-scanner's runs into the running SARIF (semgrep[+gitleaks]) — same
          # one-doc-multiple-runs model, 8 MiB size-guard, and non-fatal `|| true` as
          # the gitleaks step. Over-cap keeps the prior tools (the established lane
          # wins). A malformed osv.sarif (e.g. a stray stdout banner) falls back to
          # empty via load(), so the prior SARIF is preserved.
          python3 - <<'PY' || true
          import json
          CAP = 7_800_000  # bytes — under the worker's REPORT_SIZE_CAP_BYTES (8 MiB)
          def load(p):
              try:
                  with open(p) as f:
                      d = json.load(f)
                  return d if isinstance(d, dict) else {"version": "2.1.0", "runs": []}
              except Exception:
                  return {"version": "2.1.0", "runs": []}
          base = load("sarif.json")
          extra = load("osv.sarif")
          base_runs = base.get("runs") or []
          extra_runs = extra.get("runs") or []
          merged = dict(base)
          merged["runs"] = base_runs + extra_runs
          out = json.dumps(merged)
          if len(out.encode("utf-8")) > CAP:
              print("::warning::combined SARIF over ingest cap — keeping prior tools only")
              base["runs"] = base_runs
              out = json.dumps(base)
          with open("sarif.json", "w") as f:
              f.write(out)
          PY

      - name: Mint OIDC receipt + POST to Sigilix
        env:
          INGEST_URL: ${{ inputs.ingest-url }}
          AUDIENCE: ${{ inputs.oidc-audience }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OIDC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Best-effort: if no OIDC token can be minted (e.g. a forked-PR run where
          # id-token isn't granted), skip silently — Sigilix treats an absent
          # receipt as evidence-pending, never a failure.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::notice::OIDC token unavailable (no id-token permission?) — skipping Sigilix receipt."
            exit 0
          fi
          # Non-fatal: any failure (network / HTTP / bad payload) must NOT fail the
          # caller's CI — under `set -e` an unguarded pipeline would. Time-bound it
          # so a slow/down token endpoint can't hang the job to the runner timeout.
          TOKEN=$(curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])") || {
            echo "::notice::OIDC token mint failed — skipping Sigilix receipt (non-fatal)."
            exit 0
          }
          echo "::add-mask::$TOKEN"
          # Build the envelope with Python so file contents are JSON-encoded, never
          # shell-interpolated. The envelope carries ONLY the SARIF + the values the
          # worker binds against the OIDC claims (`repository`/`repositoryId`/`sha`).
          # It deliberately does NOT send a PR number or head sha: Sigilix derives
          # the review-join PR number from the SIGNED `claims.ref` and the commit
          # from `claims.sha`, so no request-body field can influence which PR a
          # receipt joins (CR-4). `sha` here == `github.sha` == the merge commit on
          # a pull_request, which the worker checks against the PR's merge_commit_sha.
          python3 - > envelope.json <<'PY'
          import json, os
          env = {
              "sarif": open("sarif.json").read(),
              "repository": os.environ["REPOSITORY"],
              "repositoryId": os.environ["REPOSITORY_ID"],
              "sha": os.environ["OIDC_SHA"],
          }
          json.dump(env, open("envelope.json", "w"))
          PY
          # Time-bounded + non-fatal (the `|| true` keeps a failed POST from
          # failing the caller's CI — the receipt is best-effort evidence).
          code=$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/sigilix-resp -w '%{http_code}' -X POST "$INGEST_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "content-type: application/json" \
            --data-binary @envelope.json) || true
          case "$code" in
            2*) echo "::notice::Sigilix receipt accepted ($code)." ;;
            *) echo "::warning::Sigilix ingest returned ${code:-no-response} (non-fatal)." ;;
          esac
