name: Sigilix Runner - deterministic scan

# Reusable workflow. A caller invokes it (pin to a commit SHA):
#
#   jobs:
#     scan:
#       uses: sigilix/runner/.github/workflows/scan.yml@<commit-sha>
#       permissions:
#         contents: read
#         id-token: write
#       with:
#         ingest-url: https://<sigilix-worker>/runner/ingest
#         oidc-audience: <Sigilix's configured ingest audience>
#
# The scan job runs deterministic tools on the caller's checked-out code and
# uploads normalized SARIF. The ingest job has the OIDC grant, does not checkout
# source, and only posts the SARIF receipt to Sigilix.

on:
  workflow_call:
    inputs:
      ingest-url:
        description: "Sigilix ingest endpoint (the worker's POST /runner/ingest)."
        required: true
        type: string
      oidc-audience:
        description: "OIDC token audience; must equal Sigilix's configured ingest audience."
        required: true
        type: string
      semgrep:
        description: "Run Semgrep and attach Sigilix deterministic-tool metadata."
        required: false
        default: true
        type: boolean
      semgrep-config:
        description: "Semgrep ruleset passed to semgrep --config."
        required: false
        default: "auto"
        type: string
      opengrep:
        description: "Run OpenGrep and attach Sigilix deterministic-tool metadata."
        required: false
        default: true
        type: boolean
      opengrep-config:
        description: "Comma-separated OpenGrep rulesets passed as --config values."
        required: false
        default: "p/security-audit,p/owasp-top-ten"
        type: string
      eslint:
        description: "Run ESLint. Safe mode avoids repository config/plugins."
        required: false
        default: true
        type: boolean
      eslint-mode:
        description: "ESLint mode: safe or repo-config. repo-config executes caller ESLint config/plugins."
        required: false
        default: "safe"
        type: string
      tsc:
        description: "Run TypeScript compiler no-emit diagnostics for type-aware findings."
        required: false
        default: true
        type: boolean
      ruff:
        description: "Run Ruff and attach Sigilix deterministic-tool metadata."
        required: false
        default: true
        type: boolean
      brakeman:
        description: "Run Brakeman on detected Rails applications and merge its SARIF."
        required: false
        default: true
        type: boolean
      pylint:
        description: "Run Pylint with Sigilix-owned high-confidence Python error rules."
        required: false
        default: true
        type: boolean
      flake8:
        description: "Run Sigilix-controlled Flake8 checks when a .flake8 marker is present."
        required: false
        default: true
        type: boolean
      knip:
        description: "Run Knip with Sigilix-owned JavaScript and TypeScript dependency-resolution checks."
        required: false
        default: true
        type: boolean
      golangci-lint:
        description: "Run golangci-lint with Sigilix-controlled standard Go linters."
        required: false
        default: true
        type: boolean
      actionlint:
        description: "Run actionlint on GitHub Actions workflow files."
        required: false
        default: true
        type: boolean
      shellcheck:
        description: "Run ShellCheck on shell scripts."
        required: false
        default: true
        type: boolean
      gitleaks:
        description: "Also run gitleaks and merge its SARIF."
        required: false
        default: true
        type: boolean
      osv-scanner:
        description: "Also run osv-scanner and merge its SARIF."
        required: false
        default: true
        type: boolean
      checkov:
        description: "Run Checkov IaC scanning and merge its SARIF."
        required: false
        default: false
        type: boolean
      trivy:
        description: "Run Trivy filesystem scanning and merge its SARIF."
        required: false
        default: false
        type: boolean
      trufflehog:
        description: "Run TruffleHog filesystem secret scanning and merge its SARIF."
        required: false
        default: false
        type: boolean
      zizmor:
        description: "Run zizmor on GitHub Actions workflows and merge its SARIF."
        required: false
        default: true
        type: boolean
      hadolint:
        description: "Run Hadolint on Dockerfiles and merge its SARIF."
        required: false
        default: true
        type: boolean
      tflint:
        description: "Run TFLint on Terraform files and merge its SARIF."
        required: false
        default: true
        type: boolean
      biome:
        description: "Run Biome on web source files and merge its SARIF."
        required: false
        default: true
        type: boolean
      oxlint:
        description: "Run Oxlint on JavaScript and TypeScript source files and merge its SARIF."
        required: false
        default: true
        type: boolean
      ast-grep:
        description: "Run ast-grep with Sigilix-owned JavaScript and TypeScript logic rules."
        required: false
        default: true
        type: boolean
      regal:
        description: "Run Regal on Rego policy files with Sigilix-controlled bug and import rules."
        required: false
        default: true
        type: boolean
      htmlhint:
        description: "Run HTMLHint on HTML files with Sigilix-controlled correctness rules."
        required: false
        default: true
        type: boolean
      stylelint:
        description: "Run Stylelint on CSS files with Sigilix-controlled correctness rules."
        required: false
        default: true
        type: boolean
      yamllint:
        description: "Run YAMLlint on YAML config files with relaxed defaults."
        required: false
        default: true
        type: boolean
      markdownlint:
        description: "Run markdownlint on Markdown files with Sigilix-controlled correctness rules."
        required: false
        default: true
        type: boolean
      dotenv-linter:
        description: "Run dotenv-linter on .env files and merge its SARIF."
        required: false
        default: true
        type: boolean
      checkmake:
        description: "Run checkmake on Makefiles and merge its SARIF."
        required: false
        default: true
        type: boolean
      result-cap:
        description: "Maximum findings kept per Sigilix-managed deterministic tool run."
        required: false
        default: 500
        type: number
      sarif-byte-cap:
        description: "Maximum merged SARIF bytes before later runs are dropped."
        required: false
        default: 7800000
        type: number

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      AST_GREP_LINUX_X64_GNU_INTEGRITY: "sha512-r/o9Mag6OZmGevY9OJjatuUKDOX1rSvgo29qSfxpMbIciiH3hkzEW/2w1xTPZI8xnM7iC+k+CkGoknmoXVTYGg=="
      AST_GREP_NPM_INTEGRITY: "sha512-DGi6xXAOBJubGg9QWqTeW8PzKSGHWEOa3uxXspEfYf532yb3lHmNJAcKMl1d+O9Xs9bTcNeDLC8se+O+tirEFQ=="
      AST_GREP_VERSION: "0.43.0"
      BRAKEMAN_GEM_SHA256: "7bf921fa9638544835df9aa7b3e720a9a72c0267f34f92135955edd80d4dcf6f"
      BIOME_VERSION: "2.4.16"
      BRAKEMAN_VERSION: "8.0.4"
      CHECKMAKE_LINUX_AMD64_SHA256: "e2effb876913f3ee2caef0ba35f6202c5e8a3cd55a077d8d2b9ce2034257b6af"
      CHECKMAKE_VERSION: "0.3.2"
      CHECKOV_VERSION: "3.3.1"
      DETECT_LIBC_NPM_INTEGRITY: "sha512-Btj2BOOO83o3WyH59e8MgXsxEQVcarkUOpEYrubB0urwnN10yQ364rsiByU11nZlqWYZm05i/of7io4mzihBtQ=="
      DETECT_LIBC_VERSION: "2.1.2"
      DOTENV_LINTER_LINUX_X86_64_SHA256: "9e2f1f6eb88a71ac15ef209f78f5a68644db82f132d2677112b4f80ec2bd2127"
      DOTENV_LINTER_VERSION: "4.0.0"
      ESLINT_PLUGIN_SECURITY_VERSION: "4.0.1"
      ESLINT_PLUGIN_UNICORN_VERSION: "65.0.1"
      ESLINT_VERSION: "10.4.1"
      FLAKE8_VERSION: "7.3.0"
      GITLEAKS_VERSION: "8.21.2"
      GOLANGCI_LINT_LINUX_AMD64_SHA256: "8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553"
      GOLANGCI_LINT_VERSION: "2.12.2"
      HADOLINT_VERSION: "2.14.0"
      HTMLHINT_NPM_INTEGRITY: "sha512-PweWSPA1Pb+AVFIOSpIGu5KhLdmtk/uf/0CpjvrDf6XUWmdTyqUljlylwSxQ0AWLvPGcBxK2n8uISsI4lCOkBQ=="
      HTMLHINT_VERSION: "1.9.2"
      KNIP_VERSION: "6.16.1"
      MARKDOWNLINT_VERSION: "0.48.0"
      NODE_VERSION: "22.13.0"
      OPENGREP_MANYLINUX_AARCH64_SHA256: "8df71670e20336646687c6f4ddf9b4532f1a7fcd8a8ea7bfa4ea46747f61e088"
      OPENGREP_MANYLINUX_X86_SHA256: "45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319"
      OPENGREP_VERSION: "1.22.0"
      OSV_SCANNER_VERSION: "2.3.8"
      OXLINT_LINUX_X64_GNU_INTEGRITY: "sha512-Gt3KHgp46mRKz4sJeaASmKvD8ayXookRw07RMf+NowhEztGGDZ7VrXpoW96XuKJLjFukWizOFVNjmYb/u7caNQ=="
      OXLINT_NPM_INTEGRITY: "sha512-ypZkK/aDc5NQV8zIR6s2H2Tl3aNW8FmJ1m9+2qsaYuRenl8vgnHNCGwTHviWJdUQzglOlHFchgopdtGhSy17Rw=="
      OXLINT_VERSION: "1.69.0"
      PYLINT_VERSION: "4.0.5"
      RACC_GEM_SHA256: "4a7f6929691dbec8b5209a0b373bc2614882b55fc5d2e447a21aaa691303d62f"
      RACC_VERSION: "1.8.1"
      REGAL_LINUX_X86_64_SHA256: "6769dcd8e88bc5ba5ff4fac500e4a99d55b3eec3d1d0842833d84f6820a2a80f"
      REGAL_VERSION: "0.41.1"
      RESULT_CAP: ${{ inputs.result-cap }}
      RUFF_VERSION: "0.15.17"
      SARIF_BYTE_CAP: ${{ inputs.sarif-byte-cap }}
      SEMGREP_VERSION: "1.166.0"
      SHELLCHECK_VERSION: "0.11.0"
      STYLELINT_NPM_INTEGRITY: "sha512-KIlzWXMHUvgfPUR0R7TK3H80yCIi0uoivUwf+6Az4yrHJD1Q3c1qIkh/H5Z0i/K3QXgtq/UMEkWyBUSUwnpnOg=="
      STYLELINT_VERSION: "17.12.0"
      TFLINT_LINUX_AMD64_SHA256: "8441a7d97df20431f19c9b9d27ff4c63e308c964e86660bc7cc0cf7bbe0725e8"
      TFLINT_VERSION: "0.63.1"
      TRIVY_VERSION: "0.71.0"
      TRUFFLEHOG_VERSION: "3.95.5"
      TYPESCRIPT_ESLINT_VERSION: "8.61.0"
      TYPESCRIPT_NPM_INTEGRITY: "sha512-y2TvuxSZPDyQakkFRPZHKFm+KKVqIisdg9/CZwm9ftvKXLP8NRWj38/ODjNbr43SsoXqNuAisEf1GdCxqWcdBw=="
      TYPESCRIPT_VERSION: "6.0.3"
      YAMLLINT_VERSION: "1.37.1"
      ZIZMOR_VERSION: "1.25.2"
      SARIF_DIR: ${{ github.workspace }}/sarif
      SOURCE_DIR: ${{ github.workspace }}/source
      RUNNER_DIR: ${{ github.workspace }}/runner
      TOOL_MANIFEST: ${{ github.workspace }}/runner/.github/config/tool-manifest.json
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Use the default checkout ref. On pull_request, this is the merge
          # ref whose tip matches github.sha; Sigilix binds the receipt to that
          # OIDC sha, so scanned tree and signed commit stay aligned.
          path: source
          persist-credentials: false

      - name: Checkout runner helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sigilix/runner
          ref: ${{ github.workflow_sha }}
          path: runner
          persist-credentials: false

      - name: Setup pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false

      - name: Initialize SARIF workspace
        run: |
          set -euo pipefail
          mkdir -p "$SARIF_DIR"

      - name: Run Semgrep to SARIF
        if: ${{ inputs.semgrep }}
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/semgrep.raw.sarif"
          out="$SARIF_DIR/semgrep.sarif"
          if python3 -m pip install --quiet "semgrep==${SEMGREP_VERSION}"; then
            semgrep scan --config "$SEMGREP_CONFIG" --sarif --output "$raw" --quiet || true
          else
            echo "::warning::semgrep install failed - emitting empty Semgrep SARIF run."
          fi
          if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
          python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
            semgrep "$raw" "$out" --cap "$RESULT_CAP" --ensure-run

      - name: Run OpenGrep to SARIF
        if: ${{ inputs.opengrep }}
        env:
          OPENGREP_CONFIG: ${{ inputs.opengrep-config }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_opengrep.sh"

      - name: Run ESLint to SARIF
        if: ${{ inputs.eslint }}
        env:
          ESLINT_MODE: ${{ inputs.eslint-mode }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_eslint.sh"

      - name: Run TypeScript compiler to SARIF
        if: ${{ inputs.tsc }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_tsc.sh"

      - name: Run Ruff to SARIF
        if: ${{ inputs.ruff }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/ruff.raw.sarif"
          out="$SARIF_DIR/ruff.sarif"
          if python3 -m pip install --quiet "ruff==${RUFF_VERSION}"; then
            python3 -m ruff check --exit-zero --output-format sarif --output-file "$raw" . || true
          else
            echo "::warning::ruff install failed - emitting empty Ruff SARIF run."
          fi
          if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
          python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
            ruff "$raw" "$out" --cap "$RESULT_CAP" --ensure-run

      - name: Run Brakeman to SARIF
        if: ${{ inputs.brakeman }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_brakeman.sh"

      - name: Run Pylint to SARIF
        if: ${{ inputs.pylint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_pylint.sh"

      - name: Run Flake8 to SARIF
        if: ${{ inputs.flake8 }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_flake8.sh"

      - name: Run Knip to SARIF
        if: ${{ inputs.knip }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_knip.sh"

      - name: Run golangci-lint to SARIF
        if: ${{ inputs.golangci-lint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_golangci_lint.sh"

      - name: Run actionlint to SARIF
        if: ${{ inputs.actionlint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          json="$SARIF_DIR/actionlint.json"
          out="$SARIF_DIR/actionlint.sarif"
          if curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint; then
            if [ -d .github/workflows ]; then
              "$RUNNER_TEMP/actionlint" -format '{{json .}}' > "$json" || true
            else
              printf '[]' > "$json"
            fi
          else
            echo "::warning::actionlint download failed - emitting empty actionlint SARIF run."
            printf '[]' > "$json"
          fi
          python3 "$RUNNER_DIR/.github/scripts/actionlint_to_sarif.py" "$json" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run ShellCheck to SARIF
        if: ${{ inputs.shellcheck }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          json="$SARIF_DIR/shellcheck.json"
          out="$SARIF_DIR/shellcheck.sarif"
          shellcheck_bin="$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          if curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"; then
            mapfile -d '' files < <(find . -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.bats' -o -name '*.dash' -o -name '*.ksh' \) \
              -not -path './.git/*' -not -path './node_modules/*' -print0)
            if [ "${#files[@]}" -eq 0 ]; then
              printf '{"comments":[]}' > "$json"
            else
              "$shellcheck_bin" -f json1 "${files[@]}" > "$json" || true
            fi
          else
            echo "::warning::ShellCheck download failed - emitting empty ShellCheck SARIF run."
            printf '{"comments":[]}' > "$json"
          fi
          python3 "$RUNNER_DIR/.github/scripts/shellcheck_to_sarif.py" "$json" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run YAMLlint to SARIF
        if: ${{ inputs.yamllint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/yamllint.txt"
          out="$SARIF_DIR/yamllint.sarif"
          yamllint_venv="$RUNNER_TEMP/yamllint-venv"
          yamllint_python="$yamllint_venv/bin/python"
          files_list=""
          cleanup_yamllint() {
            rm -rf "$yamllint_venv"
            if [ -n "$files_list" ]; then rm -f "$files_list"; fi
          }
          trap cleanup_yamllint EXIT
          if ! python3 -m venv "$yamllint_venv"; then
            echo "::warning::yamllint venv creation failed - emitting empty YAMLlint SARIF run."
            : > "$raw"
          elif ! "$yamllint_python" -m pip install --quiet "yamllint==${YAMLLINT_VERSION}"; then
            echo "::warning::yamllint install failed - emitting empty YAMLlint SARIF run."
            : > "$raw"
          else
            files_list="$(mktemp "$RUNNER_TEMP/yamllint-files.XXXXXX")"
            if ! find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
              -not -path './.git/*' -not -path './node_modules/*' -print0 > "$files_list"; then
              echo "::warning::yamllint file discovery failed - emitting empty YAMLlint SARIF run."
              : > "$raw"
            else
              files=()
              while IFS= read -r -d '' file; do
                files+=("$file")
              done < "$files_list"
              if [ "${#files[@]}" -eq 0 ]; then
                : > "$raw"
              else
                "$yamllint_python" -m yamllint -d relaxed -f parsable -- "${files[@]}" > "$raw" || true
              fi
            fi
          fi
          python3 "$RUNNER_DIR/.github/scripts/yamllint_to_sarif.py" "$raw" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run markdownlint to SARIF
        if: ${{ inputs.markdownlint }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          json="$SARIF_DIR/markdownlint.json"
          out="$SARIF_DIR/markdownlint.sarif"
          markdownlint_config="$RUNNER_DIR/.github/config/markdownlint-sigilix.json"
          if [ ! -f "$markdownlint_config" ]; then
            echo "::warning::markdownlint Sigilix config missing at $markdownlint_config - emitting empty markdownlint SARIF run."
            printf '[]' > "$json"
          else
            npx --yes "markdownlint-cli@${MARKDOWNLINT_VERSION}" \
              --config "$markdownlint_config" \
              --dot \
              --json \
              --output "$json" \
              --ignore '.git' \
              --ignore 'node_modules' \
              --ignore 'dist' \
              --ignore 'build' \
              --ignore 'coverage' \
              --ignore '.next' \
              --ignore 'out' \
              --ignore '.venv' \
              --ignore 'vendor' \
              --ignore '__pycache__' \
              --ignore '.tox' \
              --ignore '.mypy_cache' \
              --ignore '.pytest_cache' \
              --ignore '.terraform' \
              '**/*.md' '**/*.markdown' || true
            if [ ! -e "$json" ]; then printf '[]' > "$json"; fi
          fi
          python3 "$RUNNER_DIR/.github/scripts/markdownlint_to_sarif.py" "$json" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run dotenv-linter to SARIF
        if: ${{ inputs.dotenv-linter }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$RUNNER_TEMP/dotenv-linter.txt"
          out="$SARIF_DIR/dotenv-linter.sarif"
          dotenv_archive="$RUNNER_TEMP/dotenv-linter.tar.gz"
          dotenv_bin="$RUNNER_TEMP/dotenv-linter"
          trap 'rm -f "$raw"' EXIT
          if ! curl -fsSL -o "$dotenv_archive" \
            "https://github.com/dotenv-linter/dotenv-linter/releases/download/v${DOTENV_LINTER_VERSION}/dotenv-linter-linux-x86_64.tar.gz"; then
            echo "::warning::dotenv-linter download failed - emitting empty dotenv-linter SARIF run."
            : > "$raw"
          elif ! printf '%s  %s\n' "$DOTENV_LINTER_LINUX_X86_64_SHA256" "$dotenv_archive" | sha256sum -c --strict -; then
            echo "::warning::dotenv-linter checksum mismatch - emitting empty dotenv-linter SARIF run."
            : > "$raw"
          elif ! tar -xzf "$dotenv_archive" -C "$RUNNER_TEMP" dotenv-linter; then
            echo "::warning::dotenv-linter extract failed - emitting empty dotenv-linter SARIF run."
            : > "$raw"
          else
            "$dotenv_bin" --plain check --recursive --skip-updates \
              --exclude .git \
              --exclude node_modules \
              --exclude dist \
              --exclude build \
              --exclude coverage \
              --exclude .next \
              --exclude out \
              --exclude .venv \
              --exclude vendor \
              --exclude __pycache__ \
              --exclude .tox \
              --exclude .mypy_cache \
              --exclude .pytest_cache \
              --exclude .terraform \
              . > "$raw" || true
          fi
          python3 "$RUNNER_DIR/.github/scripts/dotenv_linter_to_sarif.py" "$raw" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run checkmake to SARIF
        if: ${{ inputs.checkmake }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$RUNNER_TEMP/checkmake.json"
          out="$SARIF_DIR/checkmake.sarif"
          checkmake_bin="$RUNNER_TEMP/checkmake"
          checkmake_config="$RUNNER_DIR/.github/config/checkmake-sigilix.ini"
          checkmake_raw_cap=$((10 * 1024 * 1024))
          trap 'rm -f "$raw"' EXIT
          : > "$raw"
          if ! curl -fsSL -o "$checkmake_bin" \
            "https://github.com/checkmake/checkmake/releases/download/v${CHECKMAKE_VERSION}/checkmake-v${CHECKMAKE_VERSION}.linux.amd64"; then
            echo "::warning::checkmake download failed - emitting empty checkmake SARIF run."
          elif ! printf '%s  %s\n' "$CHECKMAKE_LINUX_AMD64_SHA256" "$checkmake_bin" | sha256sum -c --strict -; then
            echo "::warning::checkmake checksum mismatch - emitting empty checkmake SARIF run."
          elif ! chmod +x "$checkmake_bin"; then
            echo "::warning::checkmake chmod failed - emitting empty checkmake SARIF run."
            rm -f "$checkmake_bin"
          elif [ ! -f "$checkmake_config" ]; then
            echo "::warning::checkmake Sigilix config missing at $checkmake_config - emitting empty checkmake SARIF run."
          else
            while IFS= read -r -d '' file; do
              current_size="$(wc -c < "$raw" | tr -d '[:space:]')"
              if [ "$current_size" -ge "$checkmake_raw_cap" ]; then
                echo "::warning::checkmake raw output exceeded ${checkmake_raw_cap} bytes - later Makefiles skipped."
                break
              fi
              output="$("$checkmake_bin" --config "$checkmake_config" --output json -- "$file" 2>/dev/null)" || true
              output_size="$(printf '%s\n' "$output" | wc -c | tr -d '[:space:]')"
              if [ -n "$output" ] && [ $((current_size + output_size)) -le "$checkmake_raw_cap" ]; then
                printf '%s\n' "$output" >> "$raw"
              fi
            done < <(find . -type f \( -name 'Makefile' -o -name 'makefile' -o -name 'GNUmakefile' -o -name '*.mk' -o -name '*.make' \) \
              -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -not -path './build/*' \
              -not -path './coverage/*' -not -path './.next/*' -not -path './out/*' -not -path './.venv/*' \
              -not -path './vendor/*' -not -path './__pycache__/*' -not -path './.tox/*' -not -path './.mypy_cache/*' \
              -not -path './.pytest_cache/*' -not -path './.terraform/*' -print0)
          fi
          python3 "$RUNNER_DIR/.github/scripts/checkmake_to_sarif.py" "$raw" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run gitleaks to SARIF
        if: ${{ inputs.gitleaks }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/gitleaks.raw.sarif"
          out="$SARIF_DIR/gitleaks.sarif"
          if ! curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks; then
            echo "::warning::gitleaks download failed - manifest will record missing output."
          else
            "$RUNNER_TEMP/gitleaks" dir . --report-format sarif --report-path "$raw" --exit-code 0 --no-banner || true
            if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              gitleaks "$raw" "$out" --cap "$RESULT_CAP" --ensure-run
          fi

      - name: Run osv-scanner to SARIF
        if: ${{ inputs.osv-scanner }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/osv.raw.sarif"
          out="$SARIF_DIR/osv.sarif"
          if ! curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"; then
            echo "::warning::osv-scanner download failed - manifest will record missing output."
          else
            chmod +x "$RUNNER_TEMP/osv-scanner"
            "$RUNNER_TEMP/osv-scanner" scan source -r --format sarif --output-file "$raw" . || true
            if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              osv-scanner "$raw" "$out" --cap "$RESULT_CAP" --ensure-run
          fi

      - name: Run Checkov to SARIF
        if: ${{ inputs.checkov }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/checkov.raw.sarif"
          out="$SARIF_DIR/checkov.sarif"
          if ! python3 -m pip install --quiet "checkov==${CHECKOV_VERSION}"; then
            echo "::warning::checkov install failed - manifest will record missing output."
          else
            checkov -d . -o sarif --quiet --compact --soft-fail --no-fail-on-crash --skip-download > "$raw" || true
            if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              checkov "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
              || echo "::warning::checkov SARIF normalization failed - manifest will record missing output."
          fi

      - name: Run Trivy to SARIF
        if: ${{ inputs.trivy }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/trivy.raw.sarif"
          out="$SARIF_DIR/trivy.sarif"
          if ! curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" trivy; then
            echo "::warning::trivy download failed - manifest will record missing output."
          else
            "$RUNNER_TEMP/trivy" fs --format sarif --output "$raw" --scanners vuln,secret,misconfig,license . || true
            if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              trivy "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
              || echo "::warning::trivy SARIF normalization failed - manifest will record missing output."
          fi

      - name: Run TruffleHog to SARIF
        if: ${{ inputs.trufflehog }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          json="$SARIF_DIR/trufflehog.json"
          out="$SARIF_DIR/trufflehog.sarif"
          if ! curl -fsSL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" trufflehog; then
            echo "::warning::trufflehog download failed - manifest will record missing output."
          else
            "$RUNNER_TEMP/trufflehog" filesystem . --json --no-verification --no-update > "$json" || true
            python3 "$RUNNER_DIR/.github/scripts/trufflehog_to_sarif.py" "$json" "$out" \
              --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP" \
              || echo "::warning::trufflehog SARIF conversion failed - manifest will record missing output."
          fi

      - name: Run zizmor to SARIF
        if: ${{ inputs.zizmor }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_zizmor.sh"

      - name: Run Hadolint to SARIF
        if: ${{ inputs.hadolint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_hadolint.sh"

      - name: Run TFLint to SARIF
        if: ${{ inputs.tflint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_tflint.sh"

      - name: Run Regal to SARIF
        if: ${{ inputs.regal }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_regal.sh"

      - name: Run Biome to SARIF
        if: ${{ inputs.biome }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/biome.raw.sarif"
          out="$SARIF_DIR/biome.sarif"
          biome_config="$RUNNER_DIR/.github/config/biome-sigilix.jsonc"
          if [ ! -f "$biome_config" ]; then
            echo "::warning::biome Sigilix config missing at $biome_config - manifest will record missing output."
          elif ! npx --yes "@biomejs/biome@${BIOME_VERSION}" lint . \
              --config-path "$biome_config" \
              --vcs-use-ignore-file=false \
              --files-ignore-unknown=true \
              --no-errors-on-unmatched \
              --reporter=sarif \
              --reporter-file="$raw"; then
            if [ ! -s "$raw" ]; then
              echo "::warning::biome scan failed and produced no SARIF output - manifest will record missing output."
            fi
          fi
          if [ -s "$raw" ]; then
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              biome "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
              || echo "::warning::biome SARIF normalization failed - manifest will record missing output."
          fi

      - name: Run Oxlint to SARIF
        if: ${{ inputs.oxlint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/oxlint.raw.sarif"
          out="$SARIF_DIR/oxlint.sarif"
          oxlint_config="$RUNNER_DIR/.github/config/oxlint-sigilix.oxlintrc.jsonc"
          oxlint_pack_dir="$RUNNER_TEMP/oxlint-pack"
          oxlint_install_dir="$RUNNER_TEMP/oxlint-${OXLINT_VERSION}"
          oxlint_package="$oxlint_pack_dir/oxlint-${OXLINT_VERSION}.tgz"
          oxlint_binding_package="$oxlint_pack_dir/oxlint-binding-linux-x64-gnu-${OXLINT_VERSION}.tgz"
          oxlint_bin="$oxlint_install_dir/node_modules/.bin/oxlint"
          files_list="$RUNNER_TEMP/oxlint-files"
          sri_sha512() { printf 'sha512-%s' "$(openssl dgst -sha512 -binary "$1" | openssl base64 -A)"; }
          tarball_size() {
            if [ ! -r "$1" ]; then
              printf '0'
              return
            fi
            wc -c < "$1" | tr -d '[:space:]'
          }
          if ! find -P . \
            \( -type d \( -name '.git' -o -name 'node_modules' -o -name 'dist' -o -name 'build' \
            -o -name 'coverage' -o -name '.next' -o -name 'out' \) -prune \) -o \
            \( -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' \
            -o -name '*.ts' -o -name '*.tsx' \) -print0 \) > "$files_list"; then
            echo "::warning::oxlint file discovery failed - manifest will record missing output."
          else
            mapfile -d '' files < "$files_list"
            if [ "${#files[@]}" -eq 0 ]; then
              printf '{"version":"2.1.0","runs":[]}' > "$raw"
            elif [ ! -f "$oxlint_config" ]; then
              echo "::warning::oxlint Sigilix config missing at $oxlint_config - manifest will record missing output."
            else
              oxlint_can_scan=true
              mkdir -p "$oxlint_pack_dir" "$oxlint_install_dir"
              if ! npm pack --silent --pack-destination "$oxlint_pack_dir" \
                --registry=https://registry.npmjs.org \
                "oxlint@${OXLINT_VERSION}" "@oxlint/binding-linux-x64-gnu@${OXLINT_VERSION}" >/dev/null; then
                echo "::warning::oxlint package download failed - manifest will record missing output."
                oxlint_can_scan=false
              elif [ ! -s "$oxlint_package" ] || [ ! -s "$oxlint_binding_package" ]; then
                echo "::warning::oxlint package tarball missing after download - manifest will record missing output."
                oxlint_can_scan=false
              elif [ "$(tarball_size "$oxlint_package")" -le 1024 ] \
                || [ "$(tarball_size "$oxlint_binding_package")" -le 1024 ]; then
                echo "::warning::oxlint package tarball at or below 1024 bytes after download - manifest will record missing output."
                oxlint_can_scan=false
              elif [ "$(sri_sha512 "$oxlint_package")" != "$OXLINT_NPM_INTEGRITY" ]; then
                echo "::warning::oxlint package integrity mismatch - manifest will record missing output."
                oxlint_can_scan=false
              elif [ "$(sri_sha512 "$oxlint_binding_package")" != "$OXLINT_LINUX_X64_GNU_INTEGRITY" ]; then
                echo "::warning::oxlint linux binding integrity mismatch - manifest will record missing output."
                oxlint_can_scan=false
              elif ! npm install --silent --prefix "$oxlint_install_dir" --ignore-scripts --omit=optional \
                --registry=https://registry.npmjs.org --no-audit --no-fund \
                "$oxlint_package" "$oxlint_binding_package"; then
                echo "::warning::oxlint verified package install failed - manifest will record missing output."
                oxlint_can_scan=false
              elif [ ! -x "$oxlint_bin" ]; then
                echo "::warning::oxlint binary missing after verified install - manifest will record missing output."
                oxlint_can_scan=false
              elif ! oxlint_version="$("$oxlint_bin" --version 2>/dev/null)"; then
                oxlint_version=""
                oxlint_can_scan=false
              else
                oxlint_detected_version="$(printf '%s\n' "$oxlint_version" | sed -nE 's/.*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
                if [ "$oxlint_detected_version" != "$OXLINT_VERSION" ]; then
                  oxlint_can_scan=false
                fi
              fi
              if [ "$oxlint_can_scan" = false ]; then
                echo "::warning::oxlint version mismatch or unavailable: expected ${OXLINT_VERSION}, got '${oxlint_version:-unavailable}' - manifest will record missing output."
              fi
              if [ "$oxlint_can_scan" = true ]; then
                if ! "$oxlint_bin" \
                  --config "$oxlint_config" \
                  --disable-nested-config \
                  --no-ignore \
                  -A all -D correctness \
                  --format sarif \
                  --no-error-on-unmatched-pattern \
                  -- \
                  "${files[@]}" > "$raw"; then
                  if [ ! -s "$raw" ]; then
                    echo "::warning::oxlint scan failed and produced no SARIF output - manifest will record missing output."
                  fi
                fi
              fi
            fi
            if [ -s "$raw" ]; then
              python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
                oxlint "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
                || echo "::warning::oxlint SARIF normalization failed - manifest will record missing output."
            fi
          fi

      - name: Run ast-grep to SARIF
        if: ${{ inputs.ast-grep }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_ast_grep.sh"

      - name: Run HTMLHint to SARIF
        if: ${{ inputs.htmlhint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_htmlhint.sh"

      - name: Run Stylelint to SARIF
        if: ${{ inputs.stylelint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          bash "$RUNNER_DIR/.github/scripts/run_stylelint.sh"

      - name: Build scan manifest
        env:
          SEMGREP_ENABLED: ${{ inputs.semgrep }}
          OPENGREP_ENABLED: ${{ inputs.opengrep }}
          ESLINT_ENABLED: ${{ inputs.eslint }}
          TSC_ENABLED: ${{ inputs.tsc }}
          RUFF_ENABLED: ${{ inputs.ruff }}
          BRAKEMAN_ENABLED: ${{ inputs.brakeman }}
          PYLINT_ENABLED: ${{ inputs.pylint }}
          FLAKE8_ENABLED: ${{ inputs.flake8 }}
          KNIP_ENABLED: ${{ inputs.knip }}
          GOLANGCI_LINT_ENABLED: ${{ inputs.golangci-lint }}
          ACTIONLINT_ENABLED: ${{ inputs.actionlint }}
          SHELLCHECK_ENABLED: ${{ inputs.shellcheck }}
          GITLEAKS_ENABLED: ${{ inputs.gitleaks }}
          OSV_SCANNER_ENABLED: ${{ inputs.osv-scanner }}
          CHECKOV_ENABLED: ${{ inputs.checkov }}
          TRIVY_ENABLED: ${{ inputs.trivy }}
          TRUFFLEHOG_ENABLED: ${{ inputs.trufflehog }}
          ZIZMOR_ENABLED: ${{ inputs.zizmor }}
          HADOLINT_ENABLED: ${{ inputs.hadolint }}
          TFLINT_ENABLED: ${{ inputs.tflint }}
          BIOME_ENABLED: ${{ inputs.biome }}
          OXLINT_ENABLED: ${{ inputs.oxlint }}
          AST_GREP_ENABLED: ${{ inputs.ast-grep }}
          REGAL_ENABLED: ${{ inputs.regal }}
          HTMLHINT_ENABLED: ${{ inputs.htmlhint }}
          STYLELINT_ENABLED: ${{ inputs.stylelint }}
          YAMLLINT_ENABLED: ${{ inputs.yamllint }}
          MARKDOWNLINT_ENABLED: ${{ inputs.markdownlint }}
          DOTENV_LINTER_ENABLED: ${{ inputs.dotenv-linter }}
          CHECKMAKE_ENABLED: ${{ inputs.checkmake }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_DIR/.github/scripts/sigilix_scan_manifest.py" \
            --tool-manifest "$TOOL_MANIFEST" \
            --sarif-dir "$SARIF_DIR" \
            -o "$SARIF_DIR/scan-manifest.json"

      - name: Merge SARIF
        run: |
          set -euo pipefail
          python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_merge.py" \
            --tool-manifest "$TOOL_MANIFEST" \
            --sarif-dir "$SARIF_DIR" \
            -o "$SARIF_DIR/sarif.json" \
            --byte-cap "$SARIF_BYTE_CAP"
          (cd "$SARIF_DIR" && sha256sum sarif.json > sarif.json.sha256)

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigilix-sarif
          path: |
            sarif/sarif.json
            sarif/sarif.json.sha256
            sarif/scan-manifest.json
          if-no-files-found: error
          retention-days: 1

  ingest:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: none
      id-token: write
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sigilix-sarif
          path: receipt

      - name: Verify SARIF artifact integrity
        run: |
          set -euo pipefail
          cd receipt
          sha256sum -c sarif.json.sha256

      - name: Mint OIDC receipt and POST to Sigilix
        env:
          INGEST_URL: ${{ inputs.ingest-url }}
          AUDIENCE: ${{ inputs.oidc-audience }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OIDC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::notice::OIDC token unavailable - skipping Sigilix receipt."
            exit 0
          fi
          TOKEN=$(curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])") || {
            echo "::notice::OIDC token mint failed - skipping Sigilix receipt."
            exit 0
          }
          echo "::add-mask::$TOKEN"
          python3 - <<'PY'
          import json, os, sys
          try:
              scan_manifest = open("receipt/scan-manifest.json", encoding="utf-8").read()
          except FileNotFoundError:
              print("::error::scan-manifest.json is missing from receipt/. The scan job must produce it.", file=sys.stderr)
              sys.exit(1)
          env = {
              "sarif": open("receipt/sarif.json", encoding="utf-8").read(),
              "scanManifest": scan_manifest,
              "repository": os.environ["REPOSITORY"],
              "repositoryId": os.environ["REPOSITORY_ID"],
              "sha": os.environ["OIDC_SHA"],
          }
          with open("envelope.json", "w", encoding="utf-8") as handle:
              json.dump(env, handle)
          PY
          code=$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/sigilix-resp -w '%{http_code}' -X POST "$INGEST_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "content-type: application/json" \
            --data-binary @envelope.json) || true
          case "$code" in
            2*) echo "::notice::Sigilix receipt accepted ($code)." ;;
            *) echo "::warning::Sigilix ingest returned ${code:-no-response} (non-fatal)." ;;
          esac
