name: Sigilix Runner - deterministic scan

# Reusable workflow. A caller invokes it (pin to a commit SHA):
#
#   jobs:
#     scan:
#       uses: sigilix/runner/.github/workflows/scan.yml@<commit-sha>
#       permissions:
#         contents: read
#         id-token: write
#       with:
#         ingest-url: https://<sigilix-worker>/runner/ingest
#         oidc-audience: <Sigilix's configured ingest audience>
#
# The scan job runs deterministic tools on the caller's checked-out code and
# uploads normalized SARIF. The ingest job has the OIDC grant, does not checkout
# source, and only posts the SARIF receipt to Sigilix.

on:
  workflow_call:
    inputs:
      ingest-url:
        description: "Sigilix ingest endpoint (the worker's POST /runner/ingest)."
        required: true
        type: string
      oidc-audience:
        description: "OIDC token audience; must equal Sigilix's configured ingest audience."
        required: true
        type: string
      semgrep:
        description: "Run Semgrep and attach Sigilix deterministic-tool metadata."
        required: false
        default: true
        type: boolean
      semgrep-config:
        description: "Semgrep ruleset passed to semgrep --config."
        required: false
        default: "auto"
        type: string
      eslint:
        description: "Run ESLint. Safe mode avoids repository config/plugins."
        required: false
        default: true
        type: boolean
      eslint-mode:
        description: "ESLint mode: safe or repo-config. repo-config executes caller ESLint config/plugins."
        required: false
        default: "safe"
        type: string
      ruff:
        description: "Run Ruff and attach Sigilix deterministic-tool metadata."
        required: false
        default: true
        type: boolean
      actionlint:
        description: "Run actionlint on GitHub Actions workflow files."
        required: false
        default: true
        type: boolean
      shellcheck:
        description: "Run ShellCheck on shell scripts."
        required: false
        default: true
        type: boolean
      gitleaks:
        description: "Also run gitleaks and merge its SARIF."
        required: false
        default: true
        type: boolean
      osv-scanner:
        description: "Also run osv-scanner and merge its SARIF."
        required: false
        default: true
        type: boolean
      checkov:
        description: "Run Checkov IaC scanning and merge its SARIF."
        required: false
        default: false
        type: boolean
      trivy:
        description: "Run Trivy filesystem scanning and merge its SARIF."
        required: false
        default: false
        type: boolean
      trufflehog:
        description: "Run TruffleHog filesystem secret scanning and merge its SARIF."
        required: false
        default: false
        type: boolean
      zizmor:
        description: "Run zizmor on GitHub Actions workflows and merge its SARIF."
        required: false
        default: true
        type: boolean
      hadolint:
        description: "Run Hadolint on Dockerfiles and merge its SARIF."
        required: false
        default: true
        type: boolean
      tflint:
        description: "Run TFLint on Terraform files and merge its SARIF."
        required: false
        default: false
        type: boolean
      biome:
        description: "Run Biome on web source files and merge its SARIF."
        required: false
        default: false
        type: boolean
      oxlint:
        description: "Run Oxlint on JavaScript and TypeScript source files and merge its SARIF."
        required: false
        default: false
        type: boolean
      yamllint:
        description: "Run YAMLlint on YAML config files with relaxed defaults."
        required: false
        default: true
        type: boolean
      result-cap:
        description: "Maximum findings kept per Sigilix-managed deterministic tool run."
        required: false
        default: 500
        type: number
      sarif-byte-cap:
        description: "Maximum merged SARIF bytes before later runs are dropped."
        required: false
        default: 7800000
        type: number

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      BIOME_VERSION: "2.4.16"
      CHECKOV_VERSION: "3.3.1"
      ESLINT_VERSION: "10.4.1"
      GITLEAKS_VERSION: "8.21.2"
      HADOLINT_VERSION: "2.14.0"
      NODE_VERSION: "22.13.0"
      OSV_SCANNER_VERSION: "2.3.8"
      OXLINT_VERSION: "1.69.0"
      RESULT_CAP: ${{ inputs.result-cap }}
      RUFF_VERSION: "0.15.17"
      SARIF_BYTE_CAP: ${{ inputs.sarif-byte-cap }}
      SEMGREP_VERSION: "1.166.0"
      SHELLCHECK_VERSION: "0.11.0"
      TFLINT_VERSION: "0.63.1"
      TRIVY_VERSION: "0.71.0"
      TRUFFLEHOG_VERSION: "3.95.5"
      YAMLLINT_VERSION: "1.37.1"
      ZIZMOR_VERSION: "1.25.2"
      SARIF_DIR: ${{ github.workspace }}/sarif
      SOURCE_DIR: ${{ github.workspace }}/source
      RUNNER_DIR: ${{ github.workspace }}/runner
      TOOL_MANIFEST: ${{ github.workspace }}/runner/.github/config/tool-manifest.json
    steps:
      - name: Checkout caller source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Use the default checkout ref. On pull_request, this is the merge
          # ref whose tip matches github.sha; Sigilix binds the receipt to that
          # OIDC sha, so scanned tree and signed commit stay aligned.
          path: source
          persist-credentials: false

      - name: Checkout runner helpers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Sigilix/runner
          ref: ${{ github.workflow_sha }}
          path: runner
          persist-credentials: false

      - name: Setup pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false

      - name: Initialize SARIF workspace
        run: |
          set -euo pipefail
          mkdir -p "$SARIF_DIR"

      - name: Run Semgrep to SARIF
        if: ${{ inputs.semgrep }}
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/semgrep.raw.sarif"
          out="$SARIF_DIR/semgrep.sarif"
          if python3 -m pip install --quiet "semgrep==${SEMGREP_VERSION}"; then
            semgrep scan --config "$SEMGREP_CONFIG" --sarif --output "$raw" --quiet || true
          else
            echo "::warning::semgrep install failed - emitting empty Semgrep SARIF run."
          fi
          if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
          python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
            semgrep "$raw" "$out" --cap "$RESULT_CAP" --ensure-run

      - name: Run ESLint to SARIF
        if: ${{ inputs.eslint }}
        env:
          ESLINT_MODE: ${{ inputs.eslint-mode }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          json="$SARIF_DIR/eslint.json"
          out="$SARIF_DIR/eslint.sarif"
          declare -a patterns=(-name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs')
          declare -a flags=(--format json)
          case "$ESLINT_MODE" in
            safe)
              flags+=(--no-config-lookup --rule no-undef:error --rule no-unreachable:error)
              ;;
            repo-config)
              echo "::warning::ESLint repo-config mode executes caller repository ESLint config and plugins in the no-OIDC scan job."
              patterns+=(-o -name '*.ts' -o -name '*.tsx')
              ;;
            *)
              echo "::warning::unknown eslint-mode '$ESLINT_MODE'; falling back to safe."
              flags+=(--no-config-lookup --rule no-undef:error --rule no-unreachable:error)
              ;;
          esac
          mapfile -d '' files < <(find . -type f \( "${patterns[@]}" \) \
            -not -path './.git/*' -not -path './node_modules/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            printf '[]' > "$json"
          else
            npx --yes "eslint@${ESLINT_VERSION}" "${flags[@]}" "${files[@]}" > "$json" || true
          fi
          python3 "$RUNNER_DIR/.github/scripts/eslint_to_sarif.py" "$json" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run Ruff to SARIF
        if: ${{ inputs.ruff }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/ruff.raw.sarif"
          out="$SARIF_DIR/ruff.sarif"
          if python3 -m pip install --quiet "ruff==${RUFF_VERSION}"; then
            python3 -m ruff check --exit-zero --output-format sarif --output-file "$raw" . || true
          else
            echo "::warning::ruff install failed - emitting empty Ruff SARIF run."
          fi
          if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
          python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
            ruff "$raw" "$out" --cap "$RESULT_CAP" --ensure-run

      - name: Run actionlint to SARIF
        if: ${{ inputs.actionlint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          json="$SARIF_DIR/actionlint.json"
          out="$SARIF_DIR/actionlint.sarif"
          if curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint; then
            if [ -d .github/workflows ]; then
              "$RUNNER_TEMP/actionlint" -format '{{json .}}' > "$json" || true
            else
              printf '[]' > "$json"
            fi
          else
            echo "::warning::actionlint download failed - emitting empty actionlint SARIF run."
            printf '[]' > "$json"
          fi
          python3 "$RUNNER_DIR/.github/scripts/actionlint_to_sarif.py" "$json" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run ShellCheck to SARIF
        if: ${{ inputs.shellcheck }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          json="$SARIF_DIR/shellcheck.json"
          out="$SARIF_DIR/shellcheck.sarif"
          shellcheck_bin="$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          if curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"; then
            mapfile -d '' files < <(find . -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.bats' -o -name '*.dash' -o -name '*.ksh' \) \
              -not -path './.git/*' -not -path './node_modules/*' -print0)
            if [ "${#files[@]}" -eq 0 ]; then
              printf '{"comments":[]}' > "$json"
            else
              "$shellcheck_bin" -f json1 "${files[@]}" > "$json" || true
            fi
          else
            echo "::warning::ShellCheck download failed - emitting empty ShellCheck SARIF run."
            printf '{"comments":[]}' > "$json"
          fi
          python3 "$RUNNER_DIR/.github/scripts/shellcheck_to_sarif.py" "$json" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run YAMLlint to SARIF
        if: ${{ inputs.yamllint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/yamllint.txt"
          out="$SARIF_DIR/yamllint.sarif"
          yamllint_venv="$RUNNER_TEMP/yamllint-venv"
          yamllint_python="$yamllint_venv/bin/python"
          files_list=""
          cleanup_yamllint() {
            rm -rf "$yamllint_venv"
            if [ -n "$files_list" ]; then rm -f "$files_list"; fi
          }
          trap cleanup_yamllint EXIT
          if ! python3 -m venv "$yamllint_venv"; then
            echo "::warning::yamllint venv creation failed - emitting empty YAMLlint SARIF run."
            : > "$raw"
          elif ! "$yamllint_python" -m pip install --quiet "yamllint==${YAMLLINT_VERSION}"; then
            echo "::warning::yamllint install failed - emitting empty YAMLlint SARIF run."
            : > "$raw"
          else
            files_list="$(mktemp "$RUNNER_TEMP/yamllint-files.XXXXXX")"
            if ! find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
              -not -path './.git/*' -not -path './node_modules/*' -print0 > "$files_list"; then
              echo "::warning::yamllint file discovery failed - emitting empty YAMLlint SARIF run."
              : > "$raw"
            else
              files=()
              while IFS= read -r -d '' file; do
                files+=("$file")
              done < "$files_list"
              if [ "${#files[@]}" -eq 0 ]; then
                : > "$raw"
              else
                "$yamllint_python" -m yamllint -d relaxed -f parsable -- "${files[@]}" > "$raw" || true
              fi
            fi
          fi
          python3 "$RUNNER_DIR/.github/scripts/yamllint_to_sarif.py" "$raw" "$out" \
            --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP"

      - name: Run gitleaks to SARIF
        if: ${{ inputs.gitleaks }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/gitleaks.raw.sarif"
          out="$SARIF_DIR/gitleaks.sarif"
          if ! curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks; then
            echo "::warning::gitleaks download failed - manifest will record missing output."
          else
            "$RUNNER_TEMP/gitleaks" dir . --report-format sarif --report-path "$raw" --exit-code 0 --no-banner || true
            if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              gitleaks "$raw" "$out" --cap "$RESULT_CAP" --ensure-run
          fi

      - name: Run osv-scanner to SARIF
        if: ${{ inputs.osv-scanner }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/osv.raw.sarif"
          out="$SARIF_DIR/osv.sarif"
          if ! curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"; then
            echo "::warning::osv-scanner download failed - manifest will record missing output."
          else
            chmod +x "$RUNNER_TEMP/osv-scanner"
            "$RUNNER_TEMP/osv-scanner" scan source -r --format sarif --output-file "$raw" . || true
            if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              osv-scanner "$raw" "$out" --cap "$RESULT_CAP" --ensure-run
          fi

      - name: Run Checkov to SARIF
        if: ${{ inputs.checkov }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/checkov.raw.sarif"
          out="$SARIF_DIR/checkov.sarif"
          if ! python3 -m pip install --quiet "checkov==${CHECKOV_VERSION}"; then
            echo "::warning::checkov install failed - manifest will record missing output."
          else
            checkov -d . -o sarif --quiet --compact --soft-fail --no-fail-on-crash --skip-download > "$raw" || true
            if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              checkov "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
              || echo "::warning::checkov SARIF normalization failed - manifest will record missing output."
          fi

      - name: Run Trivy to SARIF
        if: ${{ inputs.trivy }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/trivy.raw.sarif"
          out="$SARIF_DIR/trivy.sarif"
          if ! curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" trivy; then
            echo "::warning::trivy download failed - manifest will record missing output."
          else
            "$RUNNER_TEMP/trivy" fs --format sarif --output "$raw" --scanners vuln,secret,misconfig,license . || true
            if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              trivy "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
              || echo "::warning::trivy SARIF normalization failed - manifest will record missing output."
          fi

      - name: Run TruffleHog to SARIF
        if: ${{ inputs.trufflehog }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          json="$SARIF_DIR/trufflehog.json"
          out="$SARIF_DIR/trufflehog.sarif"
          if ! curl -fsSL "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" trufflehog; then
            echo "::warning::trufflehog download failed - manifest will record missing output."
          else
            "$RUNNER_TEMP/trufflehog" filesystem . --json --no-verification --no-update > "$json" || true
            python3 "$RUNNER_DIR/.github/scripts/trufflehog_to_sarif.py" "$json" "$out" \
              --base-dir "$SOURCE_DIR" --cap "$RESULT_CAP" \
              || echo "::warning::trufflehog SARIF conversion failed - manifest will record missing output."
          fi

      - name: Run zizmor to SARIF
        if: ${{ inputs.zizmor }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/zizmor.raw.sarif"
          out="$SARIF_DIR/zizmor.sarif"
          if [ ! -d .github/workflows ]; then
            printf '{"version":"2.1.0","runs":[]}' > "$raw"
          elif ! python3 -m pip install --quiet "zizmor==${ZIZMOR_VERSION}"; then
            echo "::warning::zizmor install failed - manifest will record missing output."
          else
            zizmor --format sarif . > "$raw" || true
            if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
          fi
          if [ -s "$raw" ]; then
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              zizmor "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
              || echo "::warning::zizmor SARIF normalization failed - manifest will record missing output."
          fi

      - name: Run Hadolint to SARIF
        if: ${{ inputs.hadolint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/hadolint.raw.sarif"
          out="$SARIF_DIR/hadolint.sarif"
          if ! curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"; then
            echo "::warning::hadolint download failed - manifest will record missing output."
          else
            if ! chmod +x "$RUNNER_TEMP/hadolint"; then
              echo "::warning::hadolint chmod failed - manifest will record missing output."
            else
              files_list="$RUNNER_TEMP/hadolint-files"
              if ! find . -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) \
                -not -path './.git/*' -not -path './node_modules/*' -print0 > "$files_list"; then
                echo "::warning::hadolint file discovery failed - manifest will record missing output."
              else
                mapfile -d '' files < "$files_list"
                if [ "${#files[@]}" -eq 0 ]; then
                  printf '{"version":"2.1.0","runs":[]}' > "$raw"
                else
                  "$RUNNER_TEMP/hadolint" --no-fail --format sarif "${files[@]}" > "$raw" || true
                  if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
                fi
                python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
                  hadolint "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
                  || echo "::warning::hadolint SARIF normalization failed - manifest will record missing output."
              fi
            fi
          fi

      - name: Run TFLint to SARIF
        if: ${{ inputs.tflint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/tflint.raw.sarif"
          out="$SARIF_DIR/tflint.sarif"
          if ! curl -fsSL -o "$RUNNER_TEMP/tflint.zip" \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"; then
            echo "::warning::tflint download failed - manifest will record missing output."
          else
            if ! unzip -q -o "$RUNNER_TEMP/tflint.zip" -d "$RUNNER_TEMP"; then
              echo "::warning::tflint unzip failed - manifest will record missing output."
            else
              files_list="$RUNNER_TEMP/tflint-files"
              if ! find . -type f -name '*.tf' \
                -not -path './.git/*' -not -path './node_modules/*' -print0 > "$files_list"; then
                echo "::warning::tflint file discovery failed - manifest will record missing output."
              else
                mapfile -d '' files < "$files_list"
                if [ "${#files[@]}" -eq 0 ]; then
                  printf '{"version":"2.1.0","runs":[]}' > "$raw"
                else
                  "$RUNNER_TEMP/tflint" --recursive --format sarif > "$raw" || true
                  if [ ! -s "$raw" ]; then printf '{"version":"2.1.0","runs":[]}' > "$raw"; fi
                fi
                python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
                  tflint "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
                  || echo "::warning::tflint SARIF normalization failed - manifest will record missing output."
              fi
            fi
          fi

      - name: Run Biome to SARIF
        if: ${{ inputs.biome }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/biome.raw.sarif"
          out="$SARIF_DIR/biome.sarif"
          if ! npx --yes "@biomejs/biome@${BIOME_VERSION}" ci . \
            --files-ignore-unknown=true \
            --reporter=sarif \
            --reporter-file="$raw"; then
            echo "::warning::biome scan failed - manifest will record missing output if no SARIF was produced."
          fi
          if [ -s "$raw" ]; then
            python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
              biome "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
              || echo "::warning::biome SARIF normalization failed - manifest will record missing output."
          fi

      - name: Run Oxlint to SARIF
        if: ${{ inputs.oxlint }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          raw="$SARIF_DIR/oxlint.raw.sarif"
          out="$SARIF_DIR/oxlint.sarif"
          oxlint_config="$RUNNER_DIR/.github/config/oxlint-sigilix.oxlintrc.jsonc"
          oxlint_cmd=(npx --yes "oxlint@${OXLINT_VERSION}")
          files_list="$RUNNER_TEMP/oxlint-files"
          if ! find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path './.git/*' -not -path './node_modules/*' -print0 > "$files_list"; then
            echo "::warning::oxlint file discovery failed - manifest will record missing output."
          else
            mapfile -d '' files < "$files_list"
            if [ "${#files[@]}" -eq 0 ]; then
              printf '{"version":"2.1.0","runs":[]}' > "$raw"
            elif [ ! -f "$oxlint_config" ]; then
              echo "::warning::oxlint Sigilix config missing at $oxlint_config - manifest will record missing output."
            else
              oxlint_can_scan=true
              if ! oxlint_version="$("${oxlint_cmd[@]}" --version 2>/dev/null)"; then
                oxlint_version=""
                oxlint_can_scan=false
              else
                oxlint_detected_version="$(printf '%s\n' "$oxlint_version" | sed -nE 's/.*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
                if [ "$oxlint_detected_version" != "$OXLINT_VERSION" ]; then
                  oxlint_can_scan=false
                fi
              fi
              if [ "$oxlint_can_scan" = false ]; then
                echo "::warning::oxlint version mismatch or unavailable: expected ${OXLINT_VERSION}, got '${oxlint_version:-unavailable}' - manifest will record missing output."
              fi
              if [ "$oxlint_can_scan" = true ]; then
                if ! "${oxlint_cmd[@]}" \
                  --config "$oxlint_config" \
                  --disable-nested-config \
                  --no-ignore \
                  -A all -D correctness \
                  --format sarif \
                  --no-error-on-unmatched-pattern \
                  -- \
                  "${files[@]}" > "$raw"; then
                  if [ ! -s "$raw" ]; then
                    echo "::warning::oxlint scan failed and produced no SARIF output - manifest will record missing output."
                  fi
                fi
              fi
            fi
            if [ -s "$raw" ]; then
              python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_contract.py" \
                oxlint "$raw" "$out" --cap "$RESULT_CAP" --ensure-run \
                || echo "::warning::oxlint SARIF normalization failed - manifest will record missing output."
            fi
          fi

      - name: Build scan manifest
        env:
          SEMGREP_ENABLED: ${{ inputs.semgrep }}
          ESLINT_ENABLED: ${{ inputs.eslint }}
          RUFF_ENABLED: ${{ inputs.ruff }}
          ACTIONLINT_ENABLED: ${{ inputs.actionlint }}
          SHELLCHECK_ENABLED: ${{ inputs.shellcheck }}
          GITLEAKS_ENABLED: ${{ inputs.gitleaks }}
          OSV_SCANNER_ENABLED: ${{ inputs.osv-scanner }}
          CHECKOV_ENABLED: ${{ inputs.checkov }}
          TRIVY_ENABLED: ${{ inputs.trivy }}
          TRUFFLEHOG_ENABLED: ${{ inputs.trufflehog }}
          ZIZMOR_ENABLED: ${{ inputs.zizmor }}
          HADOLINT_ENABLED: ${{ inputs.hadolint }}
          TFLINT_ENABLED: ${{ inputs.tflint }}
          BIOME_ENABLED: ${{ inputs.biome }}
          OXLINT_ENABLED: ${{ inputs.oxlint }}
          YAMLLINT_ENABLED: ${{ inputs.yamllint }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_DIR/.github/scripts/sigilix_scan_manifest.py" \
            --tool-manifest "$TOOL_MANIFEST" \
            --sarif-dir "$SARIF_DIR" \
            -o "$SARIF_DIR/scan-manifest.json"

      - name: Merge SARIF
        run: |
          set -euo pipefail
          python3 "$RUNNER_DIR/.github/scripts/sigilix_sarif_merge.py" \
            --tool-manifest "$TOOL_MANIFEST" \
            --sarif-dir "$SARIF_DIR" \
            -o "$SARIF_DIR/sarif.json" \
            --byte-cap "$SARIF_BYTE_CAP"
          (cd "$SARIF_DIR" && sha256sum sarif.json > sarif.json.sha256)

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigilix-sarif
          path: |
            sarif/sarif.json
            sarif/sarif.json.sha256
            sarif/scan-manifest.json
          if-no-files-found: error
          retention-days: 1

  ingest:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: none
      id-token: write
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sigilix-sarif
          path: receipt

      - name: Verify SARIF artifact integrity
        run: |
          set -euo pipefail
          cd receipt
          sha256sum -c sarif.json.sha256

      - name: Mint OIDC receipt and POST to Sigilix
        env:
          INGEST_URL: ${{ inputs.ingest-url }}
          AUDIENCE: ${{ inputs.oidc-audience }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OIDC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::notice::OIDC token unavailable - skipping Sigilix receipt."
            exit 0
          fi
          TOKEN=$(curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])") || {
            echo "::notice::OIDC token mint failed - skipping Sigilix receipt."
            exit 0
          }
          echo "::add-mask::$TOKEN"
          python3 - <<'PY'
          import json, os, sys
          try:
              scan_manifest = open("receipt/scan-manifest.json", encoding="utf-8").read()
          except FileNotFoundError:
              print("::error::scan-manifest.json is missing from receipt/. The scan job must produce it.", file=sys.stderr)
              sys.exit(1)
          env = {
              "sarif": open("receipt/sarif.json", encoding="utf-8").read(),
              "scanManifest": scan_manifest,
              "repository": os.environ["REPOSITORY"],
              "repositoryId": os.environ["REPOSITORY_ID"],
              "sha": os.environ["OIDC_SHA"],
          }
          with open("envelope.json", "w", encoding="utf-8") as handle:
              json.dump(env, handle)
          PY
          code=$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/sigilix-resp -w '%{http_code}' -X POST "$INGEST_URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "content-type: application/json" \
            --data-binary @envelope.json) || true
          case "$code" in
            2*) echo "::notice::Sigilix receipt accepted ($code)." ;;
            *) echo "::warning::Sigilix ingest returned ${code:-no-response} (non-fatal)." ;;
          esac
