id: js-async-array-predicate
valid:
  - const ready = items.filter(item => isReady(item));
  - const transformed = items.map(async item => transform(item));
invalid:
  - const ready = items.filter(async item => isReady(item));
  - const anyReady = items.some(async (item) => isReady(item));
  - const allReady = items.every(async function (item) { return isReady(item); });
  - const found = items.find(async item => isReady(item));
  - const index = items.findIndex(async item => isReady(item));
  - const last = items.findLast(async (item) => isReady(item));
  - const lastIndex = items.findLastIndex(async function (item) { return isReady(item); });
