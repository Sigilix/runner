  - "const anyReady = items.some(async (item: Item) => isReady(item));"
  - "const allReady = items.every(async function (item: Item) { return isReady(item); });"
  - const found = items.find(async item => isReady(item));
  - const index = items.findIndex(async item => isReady(item));
  - const last = items.findLast(async item => isReady(item));
  - const lastIndex = items.findLastIndex(async item => isReady(item));
