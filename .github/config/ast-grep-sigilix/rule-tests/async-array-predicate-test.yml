id: tsx-async-array-predicate
valid:
  - "function ReadyList({items}: Props) { return <>{items.filter(item => isReady(item)).map(render)}</>; }"
  - "function ReadyList({items}: Props) { return <>{items.findLast(item => isReady(item))}</>; }"
  - "function ReadyList({items}: Props) { return <>{items.findLastIndex(item => isReady(item))}</>; }"
invalid:
  - "function ReadyList({items}: Props) { return <>{items.filter(async item => isReady(item)).map(render)}</>; }"
  - "function ReadyList({items}: Props) { return <>{items.findLast(async item => isReady(item))}</>; }"
  - "function ReadyList({items}: Props) { return <>{items.findLastIndex(async item => isReady(item))}</>; }"
