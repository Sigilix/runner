id: js-await-for-each-async-callback
language: JavaScript
severity: error
message: "forEach does not await async callbacks; use for...of or Promise.all(array.map(...))."
rule:
  any:
    - pattern: await $ARRAY.forEach(async $ARG => $BODY)
    - pattern: await $ARRAY.forEach(async ($$$ARGS) => $BODY)
    - pattern: await $ARRAY.forEach(async function ($$$ARGS) { $$$BODY })
---
